[plugin]

name="gs-settings"
description="Game settings as a bounded document rather than a singleton: declared entries with types and ranges, three scopes (device, account, server), a pluggable store, atomic debounced writes, and a policy saying what a server may clamp and what it may never read. Depends on gs-core and gs-save."
author="dot"
version="0.1.0"
script="gs_settings_plugin.gd"
